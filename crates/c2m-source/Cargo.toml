[package]
name = "c2m-source"
version.workspace = true
edition.workspace = true
description = "Video sources: metadata, downloads, subtitles and Bilibili login"
license.workspace = true
publish = false

[dependencies]
c2m-config = { path = "../c2m-config" }
c2m-core = { path = "../c2m-core" }
c2m-dispatch = { path = "../c2m-dispatch" }
c2m-i18n = { path = "../c2m-i18n" }
c2m-process = { path = "../c2m-process" }
c2m-protocol = { path = "../c2m-protocol" }
anyhow.workspace = true
base64.workspace = true
getrandom.workspace = true
indexmap.workspace = true
open.workspace = true
qrcode.workspace = true
# The passport encrypts a password with RSA-PKCS#1 v1.5 under its one-time public
# key; only the public-key operation is used.
rsa = { version = "0.9", features = ["getrandom"] }
serde.workspace = true
serde_json.workspace = true
subtitle-parse.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
# native-tls: see bilibili_agent_builder — bilibili's edge resets rustls
# handshakes. vendored builds OpenSSL in-tree on Linux so shipped binaries do
# not pick up a runtime libssl dependency.
ureq = { workspace = true, features = ["native-tls", "vendored"] }
url.workspace = true
zeroize = "1"

[dev-dependencies]
c2m-test-http = { path = "../c2m-test-http" }
