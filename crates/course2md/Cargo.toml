[package]
name = "course2md"
version.workspace = true
edition.workspace = true
description = "Turn online course videos (YouTube/Bilibili) into image+transcript markdown notes"
license.workspace = true
publish = false

[features]
default = ["cli"]
# The command line: its parser, setup wizard and doctor. The desktop builds the engine
# without it.
cli = ["dep:clap", "c2m-engine/clap"]

[[bin]]
name = "course2md"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
c2m-ai = { path = "../c2m-ai" }
c2m-artifact = { path = "../c2m-artifact" }
c2m-asr = { path = "../c2m-asr" }
c2m-config = { path = "../c2m-config" }
c2m-core = { path = "../c2m-core" }
c2m-dispatch = { path = "../c2m-dispatch" }
c2m-engine = { path = "../c2m-engine" }
c2m-i18n = { path = "../c2m-i18n" }
c2m-process = { path = "../c2m-process" }
c2m-protocol = { path = "../c2m-protocol" }
c2m-source = { path = "../c2m-source" }
anyhow.workspace = true
clap = { workspace = true, optional = true }
dialoguer.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[dev-dependencies]
c2m-test-http = { path = "../c2m-test-http" }
tempfile.workspace = true
tokio.workspace = true
which.workspace = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(apple_native)'] }
