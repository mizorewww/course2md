[package]
name = "course2md-desktop"
version = "2.0.1"
edition = "2024"
license = "MIT"
description = "Native course2md desktop application"

[workspace]

[features]
# Explicitly opt in when investigating native frame pacing. Ordinary builds
# neither collect nor write performance data.
performance = ["gpui-kit/profiler"]
# Render named pages to PNG files for layout review (src/capture.rs).
capture = ["gpui-kit/test-support"]

[dependencies]
course2md = { path = ".." }
# The stack gpui-kit-material pins, at one revision of that repository.
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b", features = ["gpui-fast"] }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b", default-features = false, features = ["serde", "gpui-fast"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
url = "2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
which = "8.0.6"
zeroize = "1"
base64 = "0.22"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pulldown-cmark = "0.13"
trash = "5"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[build-dependencies]
embed-resource = "3.0"
# The revision gpui-kit-material pins. Its fonts stay in the build script: build.rs
# renders what assets/symbols.txt lists, and the app keeps `embedded-symbols` off.
gpui-material-symbols = { git = "https://github.com/mizorewww/gpui-material-symbols", rev = "593aa15a46076f3e2870c23c0e4fd79f94f105bd", default-features = false, features = ["embed-assets"] }

[dev-dependencies]
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b", features = ["gpui-fast", "test-support"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-fast]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
gpui-fast = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b" }
gpui-fast-apple = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b" }
gpui-fast-macos = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b" }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b" }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "a5acb0c2c52f091759f6ba157c05abd21c94c34b" }
