[package]
name = "course2md-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native course2md desktop application"
publish = false

[features]
# Explicitly opt in when investigating native frame pacing. Ordinary builds
# neither collect nor write performance data.
performance = ["gpui-kit/profiler"]
# Render named pages to PNG files for layout review (src/capture.rs).
capture = ["gpui-kit/test-support"]

[dependencies]
course2md = { path = "../crates/course2md", default-features = false }
desktop-accounts = { path = "accounts" }
desktop-prefs = { path = "prefs" }
desktop-reader-core = { path = "reader-core" }
desktop-store = { path = "store" }
desktop-tasks = { path = "tasks" }
desktop-ui = { path = "ui" }
gpui-kit.workspace = true
gpui-base.workspace = true
gpui-kit-material = { workspace = true, features = ["buttons", "containment", "dialogs", "feedback", "inputs", "menus", "navigation", "progress", "selection", "window-chrome"] }
anyhow.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
url.workspace = true
chrono.workspace = true
image = { workspace = true, features = ["webp"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }
