[package]
name = "course2md-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native course2md desktop application"
publish = false

[features]
# Explicitly opt in when investigating native frame pacing. Ordinary builds
# neither collect nor write performance data.
performance = ["gpui-kit/profiler"]
# Render named pages to PNG files for layout review (src/capture.rs).
capture = ["gpui-kit/test-support"]

[dependencies]
course2md = { path = "../crates/course2md" }
desktop-core = { path = "core" }
# The stack gpui-kit-material pins, at one revision of that repository.
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "ab9fa9c703fe334abeb85286738857a5f42388c9", features = ["gpui-fast"] }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "ab9fa9c703fe334abeb85286738857a5f42388c9" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "ab9fa9c703fe334abeb85286738857a5f42388c9", default-features = false, features = ["serde", "gpui-fast"] }
anyhow = "1"
serde_json = "1"
smol = "2"
tempfile = "3"
url = "2"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3.0"
# The revision gpui-kit-material pins. Its fonts stay in the build script: build.rs
# renders what assets/symbols.txt lists, and the app keeps `embedded-symbols` off.
gpui-material-symbols = { git = "https://github.com/mizorewww/gpui-material-symbols", rev = "593aa15a46076f3e2870c23c0e4fd79f94f105bd", default-features = false, features = ["embed-assets"] }

[dev-dependencies]
tempfile = "3"
desktop-core = { path = "core", features = ["test-support"] }
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "ab9fa9c703fe334abeb85286738857a5f42388c9", features = ["gpui-fast", "test-support"] }
