[package]
name = "course2md-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Native course2md desktop application"
publish = false

[features]
# Explicitly opt in when investigating native frame pacing. Ordinary builds
# neither collect nor write performance data.
performance = ["gpui-kit/profiler"]
# Render named pages to PNG files for layout review (src/capture.rs).
capture = ["gpui-kit/test-support"]

[dependencies]
course2md = { path = "../crates/course2md" }
desktop-core = { path = "core" }
desktop-ui = { path = "ui" }
# The stack gpui-kit-material pins, at one revision of that repository.
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "79bce30bc9800a95cde66ada9ac7f7d1304cd320", features = ["gpui-fast"] }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "79bce30bc9800a95cde66ada9ac7f7d1304cd320" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "79bce30bc9800a95cde66ada9ac7f7d1304cd320", default-features = false, features = ["serde", "gpui-fast", "buttons", "containment", "dialogs", "feedback", "inputs", "menus", "navigation", "progress", "selection", "window-chrome"] }
anyhow = "1"
serde_json = "1"
smol = "2"
tempfile = "3"
url = "2"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
desktop-core = { path = "core", features = ["test-support"] }
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "79bce30bc9800a95cde66ada9ac7f7d1304cd320", features = ["gpui-fast", "test-support"] }
