[package]
name = "course2md-desktop"
version = "2.0.1"
edition = "2024"
license = "MIT"
description = "Native course2md desktop application"

[workspace]

[features]
# Explicitly opt in when investigating native frame pacing. Ordinary builds
# neither collect nor write performance data.
performance = ["gpui-kit/profiler"]
# Render named pages to PNG files for layout review (src/capture.rs).
capture = ["gpui-kit/test-support"]

[dependencies]
course2md = { path = ".." }
# The same stack as gpui-kit-material. The [patch] tables below must stay equal
# to that repository's. Paths flip to a pinned Git revision before acceptance.
gpui-kit = { path = "../../gpui-kit-material-course2md/vendor/gpui-kit", features = ["gpui-fast"] }
gpui-base = { path = "../../gpui-kit-material-course2md/vendor/gpui-base" }
gpui-kit-material = { path = "../../gpui-kit-material-course2md/crates/material", default-features = false, features = ["serde", "gpui-fast"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
url = "2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
base64 = "0.22"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pulldown-cmark = "0.13"
trash = "5"
unicode-segmentation = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
gpui-kit = { path = "../../gpui-kit-material-course2md/vendor/gpui-kit", features = ["gpui-fast", "test-support"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-fast]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

[patch.crates-io]
gpui-fast-macos = { path = "../../gpui-kit-material-course2md/vendor/gpui-fast-macos" }
gpui-pre-macos = { path = "../../gpui-kit-material-course2md/vendor/gpui-pre-macos" }
gpui-fast = { path = "../../gpui-kit-material-course2md/vendor/gpui-fast" }
gpui-fast-web = { path = "../../gpui-kit-material-course2md/vendor/gpui-fast-web" }
gpui-fast-apple = { path = "../../gpui-kit-material-course2md/vendor/gpui-fast-apple" }
gpui-base = { path = "../../gpui-kit-material-course2md/vendor/gpui-base" }
gpui-pre = { path = "../../gpui-kit-material-course2md/vendor/gpui-pre" }
gpui-pre-web = { path = "../../gpui-kit-material-course2md/vendor/gpui-pre-web" }
gpui-pre-apple = { path = "../../gpui-kit-material-course2md/vendor/gpui-pre-apple" }
gpui-fast-linux = { path = "../../gpui-kit-material-course2md/vendor/gpui-fast-linux" }
gpui-fast-wgpu = { path = "../../gpui-kit-material-course2md/vendor/gpui-fast-wgpu" }
gpui-fast-windows = { path = "../../gpui-kit-material-course2md/vendor/gpui-fast-windows" }
gpui-pre-linux = { path = "../../gpui-kit-material-course2md/vendor/gpui-pre-linux" }
gpui-pre-wgpu = { path = "../../gpui-kit-material-course2md/vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "../../gpui-kit-material-course2md/vendor/gpui-pre-windows" }
wgpu = { path = "../../gpui-kit-material-course2md/vendor/wgpu" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { path = "../../gpui-kit-material-course2md/vendor/gpui-kit" }
gpui-base = { path = "../../gpui-kit-material-course2md/vendor/gpui-base" }
