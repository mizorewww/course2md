[package]
name = "course2md-desktop"
version = "2.0.0-rc.6"
edition = "2024"
license = "MIT"
description = "Native course2md desktop application"

[workspace]
exclude = [".deps/zed", ".deps/component"]

[features]
# Explicitly opt in when investigating native frame pacing. Ordinary builds
# neither collect nor write performance data.
performance = ["gpui/profiler"]

[dependencies]
course2md = { path = ".." }
gpui = { path = ".deps/zed/crates/gpui" }
gpui_platform = { path = ".deps/zed/crates/gpui_platform", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { path = ".deps/component/crates/component" }
gpui-base = { path = ".deps/component/crates/base" }
gpui-kit-assets = { path = ".deps/component/crates/assets" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
tempfile = "3"
url = "2"
ureq = { version = "2", features = ["json"] }
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
base64 = "0.22"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
pulldown-cmark = "0.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = "4"

[target.'cfg(windows)'.dependencies]
same-file = "1.0.6"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[build-dependencies]
embed-resource = "3.0"

[dev-dependencies]
gpui = { path = ".deps/zed/crates/gpui", features = ["test-support"] }


[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
