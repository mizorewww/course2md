[package]
name = "desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The course2md desktop's state, persistence, preferences and task logic, without GPUI"
publish = false

[features]
# What the binary's own tests build their fixtures from.
test-support = []

[dependencies]
course2md = { path = "../../crates/course2md", default-features = false }
desktop-prefs = { path = "../prefs" }
desktop-accounts = { path = "../accounts" }
desktop-store = { path = "../store" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
url.workspace = true
zeroize.workspace = true
chrono.workspace = true
image = { workspace = true, features = ["webp"] }
unicode-segmentation.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
desktop-store = { path = "../store", features = ["test-support"] }
desktop-prefs = { path = "../prefs", features = ["test-support"] }
