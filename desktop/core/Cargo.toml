[package]
name = "desktop-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The course2md desktop's state, persistence, preferences and task logic, without GPUI"
publish = false

[features]
# What the binary's own tests build their fixtures from.
test-support = []

[dependencies]
course2md = { path = "../../crates/course2md" }
gpui-kit-material-color.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
url.workspace = true
ureq.workspace = true
uuid = { workspace = true, features = ["v4"] }
walkdir.workspace = true
same-file.workspace = true
which.workspace = true
zeroize.workspace = true
base64.workspace = true
chrono.workspace = true
image = { workspace = true, features = ["webp"] }
pulldown-cmark.workspace = true
unicode-segmentation.workspace = true
trash.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
c2m-test-http = { path = "../../crates/c2m-test-http" }
