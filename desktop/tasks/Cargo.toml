[package]
name = "desktop-tasks"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The course2md desktop's sources, task plans, imports and engine runs, without GPUI"
publish = false

[dependencies]
course2md = { path = "../../crates/course2md", default-features = false }
desktop-prefs = { path = "../prefs" }
desktop-store = { path = "../store" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
url.workspace = true
zeroize.workspace = true
image = { workspace = true, features = ["webp"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
desktop-prefs = { path = "../prefs", features = ["test-support"] }
desktop-store = { path = "../store", features = ["test-support"] }
