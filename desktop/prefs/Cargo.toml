[package]
name = "desktop-prefs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The course2md desktop's preferences, services and their checks, and how it keeps a record"
publish = false

[features]
# The in-memory credential vault that other crates' tests build on.
test-support = []

[dependencies]
c2m-ai = { path = "../../crates/c2m-ai" }
c2m-asr = { path = "../../crates/c2m-asr" }
c2m-config = { path = "../../crates/c2m-config" }
c2m-core = { path = "../../crates/c2m-core" }
c2m-engine = { path = "../../crates/c2m-engine" }
c2m-i18n = { path = "../../crates/c2m-i18n" }
c2m-process = { path = "../../crates/c2m-process" }
gpui-kit-material-color.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
smol.workspace = true
tempfile.workspace = true
url.workspace = true
ureq.workspace = true
uuid = { workspace = true, features = ["v4"] }
which.workspace = true
zeroize.workspace = true
base64.workspace = true
chrono.workspace = true

[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

[dev-dependencies]
c2m-test-http = { path = "../../crates/c2m-test-http" }
