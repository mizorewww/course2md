[graph]
all-features = true
# The engine and CLI, as before the workspaces merged. The desktop's stack has not been
# through these rules; its licenses are checked by cargo-about when packaging.
exclude = ["course2md-desktop", "desktop-core", "desktop-ui"]

[advisories]
yanked = "deny"
ignore = [
    # Unmaintained, not a vulnerability. Reached only through ratex-svg, for rendering
    # formulas. Remove when ratex moves to another font parser.
    { id = "RUSTSEC-2026-0192", reason = "unmaintained, transitive through ratex-svg" },
    # The Marvin timing attack recovers a private key from decryption or signing
    # timings. The Bilibili login only encrypts with the server's public key
    # (c2m-source auth/passport.rs); no private-key operation exists here.
    { id = "RUSTSEC-2023-0071", reason = "rsa: public-key encryption only, no private-key operations" },
]

[licenses]
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
    "https://github.com/mizorewww/model-fetch",
    "https://github.com/mizorewww/slide-detect",
    "https://github.com/mizorewww/subtitle-parse",
]
