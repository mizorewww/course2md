name: Rust toolchain
description: The toolchain named in rust-toolchain.toml.
inputs:
  targets:
    description: Additional compilation targets
    required: false
runs:
  using: composite
  steps:
    - id: channel
      shell: bash
      run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.channel.outputs.channel }}
        components: clippy, rustfmt
        targets: ${{ inputs.targets }}
