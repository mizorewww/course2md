name: Desktop build dependencies
description: Rust toolchain with cache, packaging tools, native libraries and prepared GPUI sources.
inputs:
  locked:
    description: Prepare the GPUI revisions frozen in desktop/sources.lock.json
    default: 'true'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          desktop -> desktop/target
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Native packaging tools
      shell: bash
      run: python -m pip install -r desktop/scripts/requirements-packaging.txt
    - name: Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libgit2-dev libstdc++-14-dev
    - name: Windows LLVM
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm --no-progress -y
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
    - name: Prepare GPUI sources
      shell: bash
      env:
        LOCKED: ${{ inputs.locked }}
      run: |
        mode=()
        if [ "$LOCKED" = true ]; then mode=(--locked); fi
        python desktop/scripts/sources.py "${mode[@]}"
