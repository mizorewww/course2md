name: Desktop build dependencies
description: Rust toolchain with cache, packaging tools and native libraries.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-toolchain
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-about@0.9.3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Native packaging tools
      shell: bash
      run: python -m pip install --require-hashes -r desktop/scripts/requirements-packaging.txt
    # The Windows installer (desktop/installer/windows): the hosted image ships
    # Inno Setup; install it only if a future image drops it.
    - name: Inno Setup
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $patterns = "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe"
        $iscc = Get-ChildItem $patterns -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $iscc) {
          choco install innosetup --no-progress -y
          $iscc = Get-ChildItem $patterns -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
        }
        if (-not $iscc) { Write-Error 'Inno Setup is unavailable'; exit 1 }
        Write-Host "Inno Setup compiler: $($iscc.FullName)"
        "ISCC=$($iscc.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
    # Bundled tools: ffmpeg built from source and the archives prebuilt.py
    # downloads, reused until either recipe changes. Every cached download
    # and build is re-verified against its pinned hash or build manifest.
    # (The Windows ffmpeg comes from the windows-ffmpeg job instead.)
    - name: Bundled tool cache
      uses: actions/cache@v4
      with:
        path: desktop/.cache/tools
        key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/ffmpeg_bundle.py', 'desktop/scripts/prebuilt.py') }}
    - name: Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev nasm zlib1g-dev libgnutls28-dev
