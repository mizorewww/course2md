name: Desktop build dependencies
description: Rust toolchain with cache, packaging tools, native libraries and prepared GPUI sources.
inputs:
  locked:
    description: Prepare the GPUI revisions frozen in desktop/sources.lock.json
    default: 'true'
runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          desktop -> desktop/target
    - uses: actions/setup-python@v5
      if: runner.environment == 'github-hosted'
      with:
        python-version: '3.12'
    # setup-python's macOS builds only install under /Users/runner, so the
    # self-hosted Mac uses its own Python 3.11+ in a job-local virtualenv.
    - name: Self-hosted Python
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        for candidate in python3.14 python3.13 python3.12 python3.11; do
          if command -v "$candidate" >/dev/null; then python="$candidate"; break; fi
        done
        test -n "${python:-}" || { echo "::error::The self-hosted runner needs Python 3.11 or newer on PATH."; exit 1; }
        "$python" -m venv "$RUNNER_TEMP/python"
        echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
    - name: Native packaging tools
      shell: bash
      run: python -m pip install -r desktop/scripts/requirements-packaging.txt
    # The bundled ffmpeg (built from source on macOS and Linux, downloaded on
    # Windows) is reused until its recipe in ffmpeg_bundle.py changes.
    - name: Bundled tool cache
      uses: actions/cache@v4
      with:
        path: desktop/.cache/tools
        key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/ffmpeg_bundle.py') }}
    - name: Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libgit2-dev libstdc++-14-dev nasm zlib1g-dev
    - name: Windows LLVM
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install llvm --no-progress -y
        "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
    - name: Prepare GPUI sources
      shell: bash
      env:
        LOCKED: ${{ inputs.locked }}
      run: |
        mode=()
        if [ "$LOCKED" = true ]; then mode=(--locked); fi
        python desktop/scripts/sources.py "${mode[@]}"
