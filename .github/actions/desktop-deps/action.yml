name: Desktop build dependencies
description: Rust toolchain with cache, packaging tools and native libraries.
runs:
  using: composite
  steps:
    - uses: ./.github/actions/rust-toolchain
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          . -> target
          desktop -> desktop/target
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-about@0.9.3
    - uses: actions/setup-python@v5
      if: runner.environment == 'github-hosted'
      with:
        python-version: '3.12'
    # setup-python's macOS builds only install under /Users/runner, so the
    # self-hosted Mac uses its own Python 3.11+ in a job-local virtualenv.
    - name: Self-hosted Python
      if: runner.environment == 'self-hosted'
      shell: bash
      run: |
        set -euo pipefail
        for candidate in python3.14 python3.13 python3.12 python3.11; do
          if command -v "$candidate" >/dev/null; then python="$candidate"; break; fi
        done
        test -n "${python:-}" || { echo "::error::The self-hosted runner needs Python 3.11 or newer on PATH."; exit 1; }
        "$python" -m venv "$RUNNER_TEMP/python"
        echo "$RUNNER_TEMP/python/bin" >> "$GITHUB_PATH"
    - name: Native packaging tools
      shell: bash
      run: python -m pip install --require-hashes -r desktop/scripts/requirements-packaging.txt
    # Bundled tools: ffmpeg built from source and the archives prebuilt.py
    # downloads, reused until either recipe changes. Every cached download
    # and build is re-verified against its pinned hash or build manifest.
    # (The Windows ffmpeg comes from the windows-ffmpeg job instead.)
    - name: Bundled tool cache
      uses: actions/cache@v4
      with:
        path: desktop/.cache/tools
        key: bundled-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('desktop/scripts/ffmpeg_bundle.py', 'desktop/scripts/prebuilt.py') }}
    - name: Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev nasm zlib1g-dev libgnutls28-dev
