name: packaging

on:
  push:
    branches: [main]
    paths: ['packaging/**', 'desktop/scripts/**', 'desktop/installer/**', 'install.sh', 'readme.md', 'readme.zh.md', 'Cargo.toml', '.github/actions/packaging-tests/**', '.github/workflows/packaging.yml']
  pull_request:
    paths: ['packaging/**', 'desktop/scripts/**', 'desktop/installer/**', 'install.sh', 'readme.md', 'readme.zh.md', 'Cargo.toml', '.github/actions/packaging-tests/**', '.github/workflows/packaging.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/packaging-tests
      - name: Shell scripts
        run: shellcheck --severity=error install.sh packaging/aur/update-aur.sh packaging/bench-mac.sh
