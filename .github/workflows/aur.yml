name: aur

on:
  # Releases created with GITHUB_TOKEN emit no release event, so chain on the workflow.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Stable version to publish, without the v prefix (for example 2.0.0)'
        required: true
      dry_run:
        description: 'Build and validate both packages without publishing to AUR'
        type: boolean
        default: false

concurrency:
  group: aur-publish
  cancel-in-progress: false

permissions:
  contents: read
  # A dry-run release succeeds with its `release` job skipped; release-version.py
  # reads the run's jobs so that it publishes nothing here.
  actions: read

jobs:
  update-aur:
    runs-on: ubuntu-latest
    container: archlinux:base
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm --needed base-devel git openssh python desktop-file-utils ffmpeg yt-dlp aria2 libxcb libxkbcommon libxkbcommon-x11 fontconfig libx11 wayland vulkan-icd-loader
          id builder &>/dev/null || useradd -m builder

      - uses: actions/checkout@v4

      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python3 packaging/release-version.py

      - name: Setup AUR SSH (builder)
        if: ${{ steps.release.outputs.publish == 'true' && !inputs.dry_run }}
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          install -dm700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_KEY" > /home/builder/.ssh/aur_key
          chmod 600 /home/builder/.ssh/aur_key
          chown builder:builder /home/builder/.ssh/aur_key
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts
          test -s /home/builder/.ssh/known_hosts
          chown builder:builder /home/builder/.ssh/known_hosts
          su builder -s /bin/bash -c "
            git config --global user.name 'mizorewww (ci)'
            git config --global user.email 'mizorewww@users.noreply.github.com'
          "

      - name: Build, validate and update CLI and GUI AUR packages
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          mode=""
          if [ "$DRY_RUN" = true ]; then mode="--dry-run"; fi
          su builder -s /bin/bash -c "
            export GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur_key -o User=aur -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/home/builder/.ssh/known_hosts -o IdentitiesOnly=yes'
            packaging/aur/update-aur.sh '$VERSION' '$mode'
          "
