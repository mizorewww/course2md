name: native desktop

on:
  push:
    branches: [main, split/workspace]
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'native/**'
      - 'build.rs'
      - 'build_support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'i18n/**'
      - 'tests/i18n_catalog.rs'
      - 'packaging/licenses/**'
      - '.github/actions/**'
      - '.github/workflows/desktop.yml'
      - '!**.md'
  pull_request:
    paths:
      - 'desktop/**'
      - 'src/**'
      - 'native/**'
      - 'build.rs'
      - 'build_support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'i18n/**'
      - 'tests/i18n_catalog.rs'
      - 'packaging/licenses/**'
      - '.github/actions/**'
      - '.github/workflows/desktop.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Windows package's ffmpeg is cross-compiled on Linux.
  windows-ffmpeg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-ffmpeg

  desktop:
    needs: windows-ffmpeg
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-latest]
    # macOS jobs run on the maintainer's self-hosted Mac. Pull requests from
    # forks never reach it; they use GitHub's macos-26 runner instead.
    runs-on: ${{ matrix.os != 'macos-26' && matrix.os || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "course2md"]') || 'macos-26') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-deps
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ffmpeg-windows
          path: desktop/.cache/tools
      - name: Format
        run: cargo fmt --manifest-path desktop/Cargo.toml --check
      - name: Clippy
        # --no-deps keeps the GPUI crates' deprecation warnings out of the log.
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets --no-deps -- -D warnings
      - name: Check and test desktop
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: Catalog matches the strings the app looks up
        run: cargo test --test i18n_catalog
      - name: Build development binaries
        run: |
          cargo build
          cargo build --manifest-path desktop/Cargo.toml
      - name: Free compiler intermediates before creating the disk image
        if: runner.os == 'macOS'
        run: |
          rm -rf target/debug/deps target/debug/incremental desktop/target/debug/deps desktop/target/debug/incremental
          df -h .
      # --require-tools: a tool that cannot be bundled, or that fails to run
      # (an ffmpeg without https, a missing library), fails the job.
      - name: Package development build
        run: python desktop/scripts/package.py --debug --no-build --require-tools
      - uses: actions/upload-artifact@v4
        with:
          name: course2md-desktop-${{ runner.os }}
          path: |
            desktop/target/packages/*.zip
            desktop/target/packages/*.tar.gz
            desktop/target/packages/*.dmg
