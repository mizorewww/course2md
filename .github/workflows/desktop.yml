name: native desktop

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'crates/**'
      - 'native/**'
      - 'build_support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'i18n/**'
      - 'packaging/licenses/**'
      - '.github/actions/**'
      - '.github/workflows/desktop.yml'
      - '!**.md'
  pull_request:
    paths:
      - 'desktop/**'
      - 'crates/**'
      - 'native/**'
      - 'build_support/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'i18n/**'
      - 'packaging/licenses/**'
      - '.github/actions/**'
      - '.github/workflows/desktop.yml'
      - '!**.md'
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Windows package's ffmpeg is cross-compiled on Linux.
  windows-ffmpeg:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-ffmpeg

  desktop:
    needs: windows-ffmpeg
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # The hosted Ubuntu image has about 14 GB free; the workspace's debug build
      # with tests and both binaries outgrew it. Its Android, .NET and Haskell
      # toolchains are unused here.
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h .
      - uses: actions/checkout@v4
      - uses: ./.github/actions/desktop-deps
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ffmpeg-windows
          path: desktop/.cache/tools
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        # --no-deps keeps the GPUI crates' deprecation warnings out of the log.
        run: cargo clippy -p course2md-desktop -p desktop-prefs -p desktop-accounts -p desktop-store -p desktop-reader-core -p desktop-tasks -p desktop-ui --all-targets --no-deps -- -D warnings
      - name: Clippy, capture and performance builds
        # The capture and performance features are macOS tools; build them so a
        # change to either is compiled somewhere.
        if: runner.os == 'macOS'
        run: cargo clippy -p course2md-desktop --features capture,performance --all-targets --no-deps -- -D warnings
      - name: Check and test desktop
        run: cargo test -p course2md-desktop -p desktop-prefs -p desktop-accounts -p desktop-store -p desktop-reader-core -p desktop-tasks -p desktop-ui
      - name: Catalog matches the strings the app looks up
        run: cargo test --test i18n_catalog
      - name: Build development binaries
        run: |
          cargo build
          cargo build --manifest-path desktop/Cargo.toml
      - name: Free compiler intermediates before creating the disk image
        if: runner.os == 'macOS'
        run: |
          rm -rf target/debug/deps target/debug/incremental
          df -h .
      # --require-tools: a tool that cannot be bundled, or that fails to run
      # (an ffmpeg without https, a missing library), fails the job.
      - name: Package development build
        run: python desktop/scripts/package.py --debug --no-build --require-tools
      - uses: actions/upload-artifact@v4
        with:
          name: course2md-desktop-${{ runner.os }}
          path: |
            target/packages/*.zip
            target/packages/*.tar.gz
            target/packages/*.dmg
