name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish after every build passes (for example v2.0.0-alpha.1)'
        required: true
      dry_run:
        description: 'Build, sign and notarize every asset without publishing a release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release version
        run: |
          python3 - <<'PYCODE'
          import os, pathlib, tomllib
          root = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          desktop = tomllib.loads(pathlib.Path('desktop/Cargo.toml').read_text())['package']['version']
          assert root == desktop and os.environ['VERSION'] == 'v' + root, (root, desktop)
          assert pathlib.Path('docs/releases', 'v' + root + '.md').is_file(), 'missing release notes'
          PYCODE
      - uses: ./.github/actions/packaging-tests

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: course2md-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: course2md-linux-aarch64
          - os: macos-26
            target: aarch64-apple-darwin
            asset: course2md-macos-arm64
          # build.rs skips the Apple speech module on x86_64 macOS.
          - os: macos-26
            target: x86_64-apple-darwin
            asset: course2md-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: course2md-windows-x86_64.exe
            exe: true
    # macOS builds run on the maintainer's self-hosted Mac.
    runs-on: ${{ matrix.os == 'macos-26' && fromJSON('["self-hosted", "macOS", "ARM64", "course2md"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the Metal compiler on macOS
        # Without Xcode's Metal toolchain build.rs skips the Apple speech
        # module, which would ship a macOS build without CoreML recognition.
        if: runner.os == 'macOS' && matrix.target == 'aarch64-apple-darwin'
        run: xcrun --find metal >/dev/null 2>&1 || { echo "::error::Xcode's Metal compiler is unavailable on this runner. Point DEVELOPER_DIR (runner .env) or xcode-select at Xcode and run xcodebuild -downloadComponent MetalToolchain."; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Collect binary
        shell: bash
        run: cp "target/${{ matrix.target }}/release/course2md${{ matrix.exe && '.exe' || '' }}" "${{ matrix.asset }}"

      - uses: ./.github/actions/macos-signing
        if: runner.os == 'macOS'
        with:
          certificate: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASS }}

      - name: Sign macOS binary
        if: runner.os == 'macOS'
        run: |
          # Without a certificate, sign ad hoc: unsigned arm64 binaries are killed on launch.
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            codesign --force --options runtime --timestamp -s "$APPLE_SIGNING_IDENTITY" "${{ matrix.asset }}"
          else
            codesign --force --sign - "${{ matrix.asset }}"
          fi
          codesign --verify --verbose=2 "${{ matrix.asset }}"

      # MLX Metal kernels for Apple speech recognition, installed beside the CLI.
      # build.rs copies them beside the executable; see the note there.
      - name: Collect mlx.metallib
        if: matrix.target == 'aarch64-apple-darwin'
        run: cp target/aarch64-apple-darwin/release/mlx.metallib mlx-macos-arm64.metallib

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            mlx-macos-arm64.metallib

      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/keychains.orig" ]; then
            user_keychains=()
            while IFS= read -r path; do user_keychains+=("$path"); done < "$RUNNER_TEMP/keychains.orig"
            security list-keychains -d user -s "${user_keychains[@]}"
          fi

  # The Windows package's ffmpeg is cross-compiled on Linux.
  windows-ffmpeg:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/windows-ffmpeg

  desktop:
    needs: [validate, windows-ffmpeg]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-latest]
    # macOS builds run on the maintainer's self-hosted Mac.
    runs-on: ${{ matrix.os == 'macos-26' && fromJSON('["self-hosted", "macOS", "ARM64", "course2md"]') || matrix.os }}
    env:
      APPLE_API_P8: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - name: Require the Metal compiler on macOS
        # Without Xcode's Metal toolchain build.rs skips the Apple speech
        # module, which would ship a macOS build without CoreML recognition.
        if: runner.os == 'macOS'
        run: xcrun --find metal >/dev/null 2>&1 || { echo "::error::Xcode's Metal compiler is unavailable on this runner. Point DEVELOPER_DIR (runner .env) or xcode-select at Xcode and run xcodebuild -downloadComponent MetalToolchain."; exit 1; }
      - uses: ./.github/actions/desktop-deps
      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: ffmpeg-windows
          path: desktop/.cache/tools
      # Tag builds package the locked inputs; pull-request desktop tests are not implied here.
      - name: Build CLI engine and desktop app
        run: |
          cargo build --release --locked
          cargo build --release --locked --manifest-path desktop/Cargo.toml
      - uses: ./.github/actions/macos-signing
        if: runner.os == 'macOS'
        with:
          certificate: ${{ secrets.MACOS_CERT_P12 }}
          password: ${{ secrets.MACOS_CERT_PASS }}
      - name: Prepare notarization
        if: runner.os == 'macOS' && env.APPLE_SIGNING_IDENTITY != '' && env.APPLE_API_P8 != ''
        run: |
          p8="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_P8" > "$p8"
          chmod 600 "$p8"
          echo "APPLE_API_KEY_PATH=$p8" >> "$GITHUB_ENV"
      - name: Package native app
        # Includes building the bundled ffmpeg when the tool cache is cold.
        timeout-minutes: 45
        run: python -u desktop/scripts/package.py --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            desktop/target/packages/*.zip
            desktop/target/packages/*.tar.gz
            desktop/target/packages/*.dmg
          if-no-files-found: error
      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain" 2>/dev/null || true
          if [ -f "$RUNNER_TEMP/keychains.orig" ]; then
            user_keychains=()
            while IFS= read -r path; do user_keychains+=("$path"); done < "$RUNNER_TEMP/keychains.orig"
            security list-keychains -d user -s "${user_keychains[@]}"
          fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: docs/releases/${{ env.VERSION }}.md
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(env.VERSION, '-') }}
          make_latest: ${{ !contains(env.VERSION, '-') }}
