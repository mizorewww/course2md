name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish after every build passes (for example v1.6.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: course2md-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: course2md-linux-aarch64
          # macOS arm64：macos-26（Xcode 27/Swift 6.4，与开发环境一致）
          - os: macos-26
            target: aarch64-apple-darwin
            asset: course2md-macos-arm64
          # x86_64 macOS 不编译 Apple 原生模块（build.rs 按 target_arch 跳过）
          - os: macos-26
            target: x86_64-apple-darwin
            asset: course2md-macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: course2md-windows-x86_64.exe
            exe: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (unix)
        if: matrix.exe != true
        run: |
          cp "target/${{ matrix.target }}/release/course2md" "${{ matrix.asset }}"
          chmod +x "${{ matrix.asset }}"
          if [[ "$RUNNER_OS" != "macOS" ]]; then exit 0; fi
          if [ -z "${{ secrets.MACOS_CERT_P12 }}" ]; then
            # 无证书时退回 ad-hoc（ARM64 无签名会被 SIGKILL）
            codesign --force --sign - "${{ matrix.asset }}"
            exit 0
          fi
          echo "${{ secrets.MACOS_CERT_P12 }}" | base64 -d > /tmp/cert.p12
          security create-keychain -p build /tmp/build.keychain
          security import /tmp/cert.p12 -k /tmp/build.keychain -P "${{ secrets.MACOS_CERT_PASS }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k build /tmp/build.keychain
          security list-keychains -d user -s /tmp/build.keychain login.keychain-db
          curl -fsSL -o /tmp/g2.cer https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer || true
          security import /tmp/g2.cer -k /tmp/build.keychain || true
          IDENTITY="$(security find-identity -v -p codesigning /tmp/build.keychain | grep "Developer ID Application" | head -1 | sed 's/.*"\(.*\)"/\1/')"
          codesign --force --options runtime --timestamp -s "$IDENTITY" "${{ matrix.asset }}"
          codesign --verify --verbose=2 "${{ matrix.asset }}"
          security delete-keychain /tmp/build.keychain

      - name: Package (windows)
        if: matrix.exe == true
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/course2md.exe" "${{ matrix.asset }}"

      # MLX Metal kernels（CoreML 推理运行时需要，与二进制同目录）
      - name: Collect mlx.metallib (macos arm64)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          if [ -f native/apple-asr/mlx.metallib ]; then
            cp native/apple-asr/mlx.metallib mlx-macos-arm64.metallib
          else
            src="$(find native/apple-asr/.build -name default.metallib | head -1)"
            test -n "$src"
            cp "$src" mlx-macos-arm64.metallib
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}
            mlx-macos-arm64.metallib

  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
      MACOS_CERT_PASS: ${{ secrets.MACOS_CERT_PASS }}
      APPLE_API_P8: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libasound2-dev libx11-xcb-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libfontconfig1-dev libssl-dev libclang-dev libgit2-dev libstdc++-14-dev
      - name: Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install llvm --no-progress -y
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Prepare tested GPUI sources
        run: python desktop/scripts/sources.py --locked
      - name: Desktop regression tests
        run: cargo test --release --manifest-path desktop/Cargo.toml --locked
      - name: Import signing certificate
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != ''
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/desktop.keychain"
          printf '%s' "$MACOS_CERT_P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p build "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k build "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          curl -fsSL -o "$RUNNER_TEMP/g2.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security import "$RUNNER_TEMP/g2.cer" -k "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity"
          echo "APPLE_SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: Prepare notarization
        if: runner.os == 'macOS' && env.MACOS_CERT_P12 != '' && env.APPLE_API_P8 != ''
        shell: bash
        run: |
          p8="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_P8" > "$p8"
          chmod 600 "$p8"
          echo "APPLE_API_KEY_PATH=$p8" >> "$GITHUB_ENV"
      - name: Build and package native app
        run: python desktop/scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ runner.os }}
          path: |
            desktop/target/packages/*.zip
            desktop/target/packages/*.tar.gz
            desktop/target/packages/*.dmg
          if-no-files-found: error
      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/desktop.keychain" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/cert.p12"

  release:
    needs: [build, desktop]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          body_path: docs/releases/v1.6.0.md
          fail_on_unmatched_files: true
          generate_release_notes: true
