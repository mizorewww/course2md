name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.agents/**', 'desktop/**', 'packaging/**', 'install.sh']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.agents/**', 'desktop/**', 'packaging/**', 'install.sh']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    # macOS jobs run on the maintainer's self-hosted Mac. Pull requests from
    # forks never reach it; they use GitHub's macos-26 runner instead.
    runs-on: ${{ matrix.os != 'macos-26' && matrix.os || ((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted", "macOS", "ARM64", "course2md"]') || 'macos-26') }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # Tests that need ffmpeg fail rather than skip when CI is set.
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress --yes ;;
          esac

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests (task protocol, CLI)
        run: cargo test --test cli_ux --test login_cli --test task_execution --test i18n_catalog

      - name: Integration tests (synthetic video)
        if: runner.os != 'Windows'
        run: cargo test --test scene_synthetic

