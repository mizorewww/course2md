name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', '.agents/**', 'desktop/**', 'packaging/**', 'install.sh']
  pull_request:
    paths-ignore: ['**.md', 'docs/**', '.agents/**', 'desktop/**', 'packaging/**', 'install.sh']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@v2

      # Tests that need ffmpeg fail rather than skip when CI is set.
      - name: Install ffmpeg
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update && sudo apt-get install -y ffmpeg ;;
            macOS) brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg ;;
            Windows) choco install ffmpeg --no-progress --yes ;;
          esac

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --lib

      - name: Integration tests (task protocol, CLI, request identity)
        run: cargo test --test cli_ux --test login_cli --test task_execution --test i18n_catalog --test prompt_identity

      - name: Integration tests (synthetic video)
        if: runner.os != 'Windows'
        run: cargo test --test scene_synthetic

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
