name: brew-tap

on:
  # Releases created with GITHUB_TOKEN emit no release event, so chain on the workflow.
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, for example 2.0.0 or 2.0.0-rc.9 (prereleases use their own channel)'
        required: true

concurrency:
  group: brew-tap-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success') }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          ALLOW_PRERELEASE: 'true'
        run: python3 packaging/release-version.py

      - name: Set up Homebrew for runtime validation
        if: steps.release.outputs.publish == 'true'
        uses: Homebrew/actions/setup-homebrew@1f8e202ffddf94def7f42f6fa3a482e821489f9c # 2026.07.10.1

      # A deploy key with write access to mizorewww/homebrew-tap only, so a
      # leak cannot push to the AUR or any other repository.
      - name: Setup GitHub SSH
        if: steps.release.outputs.publish == 'true'
        env:
          GH_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          if [ -z "$GH_KEY" ]; then
            echo "::error::Add the HOMEBREW_TAP_DEPLOY_KEY secret: a deploy key with write access to mizorewww/homebrew-tap (see docs/PACKAGING.md)."
            exit 1
          fi
          install -dm700 ~/.ssh
          printf '%s\n' "$GH_KEY" > ~/.ssh/gh_key
          chmod 600 ~/.ssh/gh_key
          printf 'Host github.com\n  User git\n  IdentityFile ~/.ssh/gh_key\n  StrictHostKeyChecking accept-new\n' > ~/.ssh/config

      - name: Update CLI formula and GUI cask
        if: steps.release.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          git config --global user.name "mizorewww (ci)"
          git config --global user.email "mizorewww@users.noreply.github.com"
          tap="$(brew --repository)/Library/Taps/mizorewww/homebrew-tap"
          mkdir -p "$(dirname "$tap")"
          git clone -q git@github.com:mizorewww/homebrew-tap.git "$tap"
          python3 packaging/homebrew/update.py "$tap" --version "$VERSION"
          HOMEBREW_NO_AUTO_UPDATE=1 brew readall --aliases mizorewww/tap
          cd "$tap"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "tap already publishes ${VERSION}"
            exit 0
          fi
          git add --all -- Formula Casks
          if [ -d Aliases ]; then git add --all -- Aliases; fi
          git commit -qm "course2md ${VERSION}"
          git push -q origin main
          echo "homebrew-tap updated to ${VERSION}"
