[package]
name = "course2md"
version = "1.6.0"
edition = "2024"
description = "Turn online course videos (YouTube/Bilibili) into image+transcript markdown notes"
license = "MIT"

[dependencies]
qrcode = { version = "0.14.1", default-features = false }
anyhow = "1"
tempfile = "3"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.17"
image-compare = "0.5.0"
libc = "0.2"
dialoguer = "0.12.0"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(apple_native)'] }

[features]
integration = []
