[package]
name = "course2md"
version = "2.0.1"
edition = "2024"
description = "Turn online course videos (YouTube/Bilibili) into image+transcript markdown notes"
license = "MIT"

[dependencies]
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
qrcode = { version = "0.14.1", default-features = false }
anyhow = "1"
tempfile = "3"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "3", features = ["json"] }
base64 = "0.23"
getrandom = "0.4"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
open = "5"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.18"
hound = "3.5"
image-compare = "0.5.0"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
dialoguer = "0.12.0"
walkdir = "2"
whatlang = "0.18"
which = "8.0.6"
sys-locale = "0.3"

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(apple_native)'] }
