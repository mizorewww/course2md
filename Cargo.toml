[workspace]
resolver = "3"
members = ["crates/*", "desktop", "desktop/accounts", "desktop/prefs", "desktop/reader-core", "desktop/store", "desktop/tasks", "desktop/ui"]
# A plain `cargo build` or `cargo test` covers the engine and the CLI, which build on
# machines without the desktop's native libraries. `--workspace` adds the desktop.
default-members = ["crates/*"]

[workspace.package]
version = "3.0.0-alpha.4"
edition = "2024"
license = "MIT"

[workspace.dependencies]
ratex-layout = "0.1.15"
ratex-parser = "0.1.15"
ratex-svg = { version = "0.1.15", features = ["embed-fonts"] }
ratex-types = "0.1.15"
qrcode = { version = "0.14.1", default-features = false }
anyhow = "1"
tempfile = "3"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
zip = { version = "9", default-features = false }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "3", features = ["json"] }
base64 = "0.23"
getrandom = "0.4"
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
open = "5"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
indicatif = "0.18"
hound = "3.5"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
dialoguer = "0.12.0"
walkdir = "2"
whatlang = "0.18"
which = "8.0.6"
sys-locale = "0.3"
# The desktop. Its GPUI stack is the one gpui-kit-material pins, at one revision of that
# repository; members add the features they use.
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5", features = ["gpui-fast"] }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }
gpui-kit-material = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5", default-features = false, features = ["serde", "gpui-fast"] }
gpui-kit-material-color = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5", features = ["serde"] }
# The release gpui-kit-material depends on.
gpui-material-symbols = { version = "0.1", default-features = false }
smol = "2"
chrono = "0.4"
uuid = "1"
same-file = "1.0.6"
zeroize = "1"
pulldown-cmark = "0.13"
unicode-segmentation = "1"
trash = "5"
keyring = "4"
security-framework = "3.7"
embed-resource = "3.0"
mirror-fetch = { version = "0.1", features = ["ip-lookup"] }
slide-detect = "0.1"
subtitle-parse = { version = "0.1", features = ["serde"] }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package.gpui-pre]
opt-level = 3

[profile.dev.package.gpui-fast]
opt-level = 3

[profile.release]
lto = "thin"
strip = true

# Only the workspace root's patches count, so the desktop's stack is pinned here.
[patch.crates-io]
# gpui-material-symbols depends on crates.io `gpui-kit`: the same Kit as the Git one.
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }
gpui-fast = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }
gpui-fast-apple = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }
gpui-fast-macos = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }

[patch."https://github.com/longbridge/gpui-kit"]
gpui-kit = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }
gpui-base = { git = "https://github.com/mizorewww/gpui-kit-material", rev = "2a70c1d790173b07ab168a3f9094b72b9cf38bf5" }
